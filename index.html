<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auré</title>
<style>
:root{--bg:#f5f3f1;--card:#fdfcfb;--ink:#4a403c;--mut:#9a8b84;--acc:#a8746a;--gold:#c9a96e;--line:#e6dfd9;--other:#ece6e1;--marble:radial-gradient(circle at 18% 8%,rgba(255,255,255,.95),transparent 55%),linear-gradient(118deg,transparent 38%,rgba(150,135,125,.13) 39%,transparent 40.2%),linear-gradient(112deg,transparent 52%,rgba(201,169,110,.16) 52.6%,transparent 53.6%)}
@media (prefers-color-scheme:dark){:root{--bg:#211d1b;--card:#2c2725;--ink:#f1ebe6;--mut:#b8aca4;--line:#433a36;--other:#383230;--marble:linear-gradient(118deg,transparent 38%,rgba(201,169,110,.08) 39%,transparent 40.2%)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--marble),var(--bg);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:440px;margin:0 auto;padding:16px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:26px;letter-spacing:.16em;text-transform:uppercase;text-align:center;margin:18px 0 6px}
.logo{display:inline-block;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#e9d3a6,#c9a96e 55%,#a8746a);box-shadow:0 0 0 3px rgba(201,169,110,.25);margin-right:10px;vertical-align:middle}
.sub{text-align:center;color:var(--mut);margin-bottom:20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(120,90,50,.07)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:16px;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);font-weight:700}
.msg{margin-top:12px;font-size:14px;color:var(--acc)}.ok{color:#5f8a5f}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px}
.avatar{overflow:hidden;width:92px;height:92px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;font:34px Georgia,serif;color:#fff;background:linear-gradient(135deg,#e9d3a6,#c9a96e 55%,#a8746a);box-shadow:0 0 0 2px var(--gold)}
.ck{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:10px;margin-left:6px;vertical-align:middle}
.avatar img,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini{display:inline-grid;place-items:center;overflow:hidden;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#e9d3a6,#c9a96e 55%,#a8746a);color:#fff;font:14px Georgia,serif;vertical-align:middle;margin-right:8px}
.mini.sm{width:20px;height:20px;font-size:11px;margin-right:6px}
.dot{color:#9a8b84}.dot.on{color:#3fb97a}
.fl{float:right;background:none;border:0;color:var(--mut);font-size:18px;line-height:1;cursor:pointer;padding:0 0 0 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:440px;border:1px solid var(--line)}
.sheet .btn{margin-top:10px}
.cnt{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;padding-left:8px}
.c{text-align:center}.small{font-size:12px;color:var(--mut)}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.room b{display:block}.room .ic{font-size:20px;width:28px;text-align:center}.room.vip{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.room.lock{opacity:.6}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
#msgs{height:55vh;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--other);font-size:15px;word-wrap:break-word}
.b .n{font-size:12px;color:var(--mut);margin-bottom:2px}.b.me{align-self:flex-end;background:var(--acc);color:#fff}.b.me .n{color:rgba(255,255,255,.8)}
.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1}.send button{width:auto;margin:0;padding:0 20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
var sb=null,mode="login";
var app=document.getElementById("app");
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function $(q){return document.querySelector(q)}
function head(){return '<div class="brand"><span class="logo"></span>Auré</div><div class="sub">Chat, ontmoet en groei</div>'}
var CFG={url:"https://ftjhgxkyihfuhqckalrp.supabase.co",key:"sb_publishable_nMdgdkv1NlA0-VUyIH6EPw_ngRqPEPd"};
function cfg(){return CFG}
function say(t,ok){var m=$("#msg");if(m){m.className="msg"+(ok?" ok":"");m.textContent=t}}

function safeUrl(u){var c=cfg();return(typeof u==="string"&&c&&u.indexOf(c.url+"/storage/v1/object/public/avatars/")===0)?u.replace(/"/g,"%22"):""}
function avh(p){var u=safeUrl(p.avatar_url);return u?'<img src="'+u+'" alt="">':esc(((p.username||"?")[0]||"?").toUpperCase())}
async function uploadAvatar(file,uid){
var img=await new Promise(function(res,rej){var i=new Image(),u=URL.createObjectURL(file);i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u});
var s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=480;
c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,480,480);
var blob=await new Promise(function(r){c.toBlob(r,"image/jpeg",.85)});
var path=uid+"/"+Date.now()+".jpg";
var up=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
if(up.error)throw up.error;
return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl}

function setup(){
app.innerHTML=head()+'<div class="card"><b>Koppel je database</b><p class="small">Eenmalig. Plak hier de gegevens van je Supabase-project. Gebruik alleen de <b>Project URL</b> en de <b>publishable key</b> (begint met sb_publishable). Plak hier nooit de secret key.</p><label>Project URL</label><input type="text" id="u" placeholder="https://jouwproject.supabase.co" autocapitalize="none"><label>Publishable key</label><input type="text" id="k" placeholder="sb_publishable_…" autocapitalize="none"><button class="btn" id="go">Opslaan</button><div id="msg"></div></div>';
$("#go").onclick=function(){var u=$("#u").value.trim().replace(/\/$/,""),k=$("#k").value.trim();
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u)){say("De Project URL ziet er niet goed uit.");return}
if(/secret|service_role/i.test(k)||k.length<20){say("Dit lijkt niet de publishable key. Gebruik nooit een secret key.");return}
try{localStorage.setItem("aure_cfg",JSON.stringify({url:u,key:k}))}catch(e){say("Opslaan lukt niet in deze browser.");return}
start()}}

function auth(){
var reg=mode==="register";
app.innerHTML=head()+'<div class="card"><div class="tabs"><button id="t1" class="'+(reg?'':'on')+'">Inloggen</button><button id="t2" class="'+(reg?'on':'')+'">Account maken</button></div>'
+(reg?'<label>Gebruikersnaam</label><input type="text" id="un" placeholder="bijv. sanne.s" maxlength="20" autocapitalize="none" autocomplete="off"><label>Geboortejaar</label><input type="text" id="by" inputmode="numeric" maxlength="4" placeholder="bijv. 1995" autocomplete="off"><div class="small" style="margin-top:4px">Wordt nergens getoond. Alleen om te bepalen welke kamers voor jou open zijn.</div>':'')
+'<label>E-mail</label><input type="email" id="em" autocapitalize="none" autocomplete="email"><label>Wachtwoord</label><input type="password" id="pw" autocomplete="'+(reg?'new-password':'current-password')+'">'
+(reg?'<div class="chk"><input type="checkbox" id="age"><span>Ik ben 18 jaar of ouder. (Testversie: de echte leeftijdscheck volgt.)</span></div><div class="chk"><input type="checkbox" id="tm"><span>Ik ga akkoord met de <a href="#" id="l1">voorwaarden</a> en de <a href="#" id="l2">privacyverklaring</a>.</span></div>':'')
+'<button class="btn" id="go">'+(reg?'Account maken':'Inloggen')+'</button><div id="msg"></div></div>';
if(reg){$("#l1").onclick=function(e){e.preventDefault();legal("terms")};$("#l2").onclick=function(e){e.preventDefault();legal("privacy")}}
$("#t1").onclick=function(){mode="login";auth()};$("#t2").onclick=function(){mode="register";auth()};
if(reg){$("#un").oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,"").slice(0,20)}}
$("#go").onclick=async function(){
var em=$("#em").value.trim(),pw=$("#pw").value;
if(!em||pw.length<8){say("Vul je e-mail in en kies een wachtwoord van minimaal 8 tekens.");return}
this.disabled=true;
try{
if(reg){
var un=$("#un").value;
if(!/^[a-z0-9._]{3,20}$/.test(un)){say("Gebruikersnaam: 3 tot 20 tekens (letters, cijfers, punt, underscore).");this.disabled=false;return}
var by=$("#by").value.trim();
if(!/^(19|20)\d\d$/.test(by)||+by>new Date().getFullYear()-18){say("Alleen voor 18+. Vul een geldig geboortejaar in.");this.disabled=false;return}
if(!$("#age").checked){say("Alleen voor 18+.");this.disabled=false;return}
if(!$("#tm").checked){say("Ga akkoord met de voorwaarden en de privacyverklaring om door te gaan.");this.disabled=false;return}
var r=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un,birth_year:+by,accepted_terms:new Date().toISOString()}}});
if(r.error){say(r.error.message);this.disabled=false;return}
if(r.data.session){await afterLogin(r.data.session.user)}
else{say("Bijna klaar! Bevestig je e-mail via de link in je mailbox en log daarna in.",true);this.disabled=false}
}else{
var l=await sb.auth.signInWithPassword({email:em,password:pw});
if(l.error){say("Inloggen lukt niet. Controleer je e-mail en wachtwoord.");this.disabled=false;return}
await afterLogin(l.data.user)}
}catch(e){say("Er ging iets mis. Probeer het opnieuw.");this.disabled=false}}}

async function afterLogin(user){
var g=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
if(g.data){gate(g.data,user);return}
var un=(user.user_metadata||{}).username;
if(un){var i=await sb.from("profiles").insert({id:user.id,username:un}).select().single();
if(i.data){gate(i.data,user);return}
choose(user,i.error&&i.error.code==="23505"?"Deze gebruikersnaam is al bezet. Kies een andere.":"")}
else choose(user,"")}

function choose(user,m){
app.innerHTML=head()+'<div class="card"><b>Kies je gebruikersnaam</b><label>Gebruikersnaam</label><input type="text" id="un" maxlength="20" autocapitalize="none"><button class="btn" id="go">Opslaan</button><div id="msg" class="msg">'+esc(m)+'</div></div>';
$("#un").oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,"").slice(0,20)};
$("#go").onclick=async function(){var un=$("#un").value;
if(!/^[a-z0-9._]{3,20}$/.test(un)){say("Minimaal 3 tekens.");return}
var i=await sb.from("profiles").insert({id:user.id,username:un}).select().single();
if(i.data){gate(i.data,user)}else say(i.error&&i.error.code==="23505"?"Deze gebruikersnaam is al bezet.":"Opslaan lukt niet.")}}

function qa(t){return esc(t).replace(/"/g,"&quot;")}
function cntLine(c){var f=c.followers||0,g=c.following||0;return '<b>'+f+'</b> '+(f===1?'volger':'volgers')+' · <b>'+g+'</b> volgend'}
async function member(id,p,back){
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Terug</button></div><div class="card c" id="mb"><div class="small">Laden…</div></div>';
$("#bk").onclick=back;
var pr=await sb.from("profiles").select("id,username,verification,avatar_url,city,occupation").eq("id",id).maybeSingle();
var box=$("#mb");
if(!pr.data){box.innerHTML='<div class="small">Dit profiel is niet beschikbaar.</div>';return}
var u=pr.data,v=u.verification==="verified",mine=id===p.id;
var cn=await sb.rpc("follow_counts",{uid:id}),c=cn.data||{followers:0,following:0};
var isF=false;
if(!mine){var fr=await sb.from("follows").select("followed").eq("followed",id).limit(1);isF=!!(fr.data&&fr.data.length)}
var sub=[v?u.occupation:"",u.city].filter(Boolean).join(" · ");
box.innerHTML='<div class="avatar">'+avh(u)+'</div><h2 style="margin:6px 0 2px">@'+esc(u.username)+(v?'<span class="ck">✓</span>':'')+'</h2><div class="small">'+esc(sub)+'</div><div style="margin-top:10px;font-size:14px" id="fc">'+cntLine(c)+'</div>'
+(mine?'':'<button class="btn'+(isF?' ghost':'')+'" id="fo">'+(isF?'Volgend':'Volgen')+'</button><div id="msg"></div>');
if(!mine){$("#fo").onclick=async function(){
this.disabled=true;
var e=isF?await sb.from("follows").delete().eq("followed",id):await sb.from("follows").insert({followed:id});
if(e.error&&e.error.code!=="23505"){this.disabled=false;say("Dat lukt niet. Probeer het opnieuw.");return}
isF=!isF;c.followers=Math.max(0,(c.followers||0)+(isF?1:-1));
this.disabled=false;this.className="btn"+(isF?" ghost":"");this.textContent=isF?"Volgend":"Volgen";$("#fc").innerHTML=cntLine(c)}}}

function profile(p,note){
var v=p.verification==="verified",sub=[v?p.occupation:"",p.city].filter(Boolean).join(" · ");
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Chatrooms</button></div><div class="card c"><div class="avatar">'+avh(p)+'</div><h2 style="margin:6px 0 2px">@'+esc(p.username)+(v?'<span class="ck">✓</span>':'')+'</h2><div class="small">'+esc(sub)+'</div><div style="margin-top:8px;font-size:14px" id="fcc"></div><div class="small" style="margin-top:6px">Lidmaatschap: '+esc(v?"verified":p.plan)+'</div></div>'
+(note?'<div class="msg ok c">'+esc(note)+'</div>':'')
+'<button class="btn ghost" id="st">Instellingen</button>';
$("#bk").onclick=function(){home(p)};$("#st").onclick=function(){settings(p)};
sb.rpc("follow_counts",{uid:p.id}).then(function(r){var el=document.getElementById("fcc");if(el&&r.data)el.innerHTML=cntLine(r.data)})}

async function blocked(p){
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Instellingen</button></div><div class="card" id="bl"><div class="small c">Laden…</div></div>';
$("#bk").onclick=function(){settings(p)};
var g=await sb.from("blocks").select("blocked,profiles!blocked(username)");
var box=$("#bl");
if(g.error){box.innerHTML='<div class="small c">Laden lukt niet.</div>';return}
if(!g.data.length){box.innerHTML='<div class="small c">Je hebt niemand geblokkeerd.</div>';return}
box.innerHTML=g.data.map(function(r){return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0"><b>@'+esc((r.profiles||{}).username||"?")+'</b><button class="back" data-id="'+esc(r.blocked)+'">Deblokkeren</button></div>'}).join("");
box.querySelectorAll("[data-id]").forEach(function(b){b.onclick=async function(){await sb.from("blocks").delete().eq("blocked",b.dataset.id);blocked(p)}})}

var LEGAL_MAIL="";
var LEGAL={
terms:["Gebruiksvoorwaarden",[
["Wie mag meedoen","Auré is alleen voor mensen van 18 jaar en ouder. Je geeft bij het aanmaken een juist geboortejaar op."],
["Respect","Wees respectvol. Geen pesten, intimidatie, haat, bedreigingen of discriminatie. Geen spam of reclame zonder toestemming."],
["Verboden inhoud","Geen illegale inhoud, geen seksuele inhoud met of over minderjarigen, geen geweld of bedreigingen, en geen persoonlijke gegevens van anderen."],
["Je berichten","Wat je in een chatroom schrijft, kunnen alle leden van die kamer lezen. Deel dus niets wat je privé wilt houden. Jij blijft verantwoordelijk voor wat je schrijft."],
["Melden en blokkeren","Je kunt berichten melden en leden blokkeren. Wij bekijken meldingen en kunnen berichten verwijderen of accounts beperken of sluiten."],
["Vinkje en lidmaatschap","Het vinkje is alleen voor bekende personen en wordt na controle toegekend. Een vinkje of lidmaatschap geeft geen recht op bijzondere behandeling bij overtredingen."],
["Veiligheid en eigen verantwoordelijkheid","Deel geen telefoonnummers, adressen of privéfoto's met mensen die je hier ontmoet. Wij raden dat af. Doe je het toch, dan is dat je eigen keuze en risico. Spreek je buiten Auré af met iemand die je hier hebt leren kennen, dan is dat op eigen risico. Spreek af op een openbare plek en laat iemand weten waar je bent. Wij controleren niet wie iemand echt is en kunnen daar niet voor instaan."],
["Foto's en seksuele inhoud","Naaktfoto's en seksueel expliciete inhoud zijn niet toegestaan en worden verwijderd, en het account kan worden gesloten. Wat je in de app plaatst, kunnen andere leden zien en opslaan. Wij kunnen niet voorkomen dat anderen er iets mee doen. Deel dus alleen wat je goed vindt. Foto's van anderen mag je nooit zonder toestemming plaatsen of doorsturen."],
["Meld misbruik","Zie je iets wat niet kan? Tik op de drie puntjes naast een bericht om te melden of te blokkeren. Wij kijken naar meldingen en halen overtredende inhoud weg."],
["Onze verantwoordelijkheid","Auré is een vrijblijvende app voor mensen van 18 jaar en ouder. Voor wat andere leden doen of zeggen zijn wij niet aansprakelijk. Dit geldt niet als de wet anders bepaalt, bijvoorbeeld bij opzet of grove nalatigheid van onze kant."],
["Wijzigingen","Auré is in ontwikkeling. Functies, kamers en regels kunnen veranderen. Je kunt je account altijd zelf verwijderen via Instellingen."]]],
privacy:["Privacyverklaring",[
["Welke gegevens we bewaren","Gebruikersnaam, e-mailadres, geboortejaar, profielfoto, stad en beroep (alleen als je die invult), je chatberichten, je blokkades en meldingen, en eventuele verificatieaanvragen."],
["Waarvoor","Om je account te laten werken, om kamers voor jouw leeftijd en lidmaatschap te openen, om de chat te tonen, en om misbruik tegen te gaan."],
["Wat anderen zien","Je gebruikersnaam, foto, stad, beroep (met vinkje) en je berichten. Je geboortejaar en e-mailadres zien andere leden nooit."],
["Waar het staat","Je gegevens staan bij onze hostingpartner Supabase in een datacenter in de EU (Ierland). De website draait via GitHub Pages."],
["Hoe lang","Zolang je account bestaat. Verwijder je je account, dan wissen we je profiel, foto, berichten, blokkades en aanvragen."],
["Jouw rechten","Je mag je gegevens inzien, laten verbeteren of laten wissen. Wissen kun je zelf via Instellingen → Account verwijderen. Je kunt ook een klacht indienen bij de Autoriteit Persoonsgegevens."]
,["Contact",LEGAL_MAIL?("Vragen over privacy? Mail naar "+LEGAL_MAIL+"."):"Contactgegevens volgen."]]]};
function legal(k){
var L=LEGAL[k],o=document.createElement("div");o.className="ov";
o.innerHTML='<div class="sheet" style="max-height:80vh;overflow:auto"><b>'+esc(L[0])+'</b><div class="small" style="margin:4px 0 10px">Conceptversie, nog niet door een jurist gecontroleerd.</div>'
+L[1].map(function(x){return '<div style="margin:10px 0"><b style="font-size:14px">'+esc(x[0])+'</b><div class="small" style="color:var(--ink);font-size:13px;line-height:1.45">'+esc(x[1])+'</div></div>'}).join("")
+'<button class="btn" id="lc">Sluiten</button></div>';
o.querySelector("#lc").onclick=function(){o.remove()};document.body.appendChild(o)}

function delAcc(p){
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Instellingen</button></div><div class="card"><h3 style="margin:0 0 8px">Account verwijderen</h3><div class="small">Hiermee verwijder je voorgoed je profiel, foto, berichten, blokkades en aanvragen. Dit kan niet ongedaan worden gemaakt.</div><label>Typ VERWIJDER om te bevestigen</label><input type="text" id="dc" autocapitalize="characters" autocomplete="off"><button class="btn" id="dg" style="background:#8a3b3b">Definitief verwijderen</button><div id="msg"></div></div>';
$("#bk").onclick=function(){settings(p)};
$("#dg").onclick=async function(){
if($("#dc").value.trim().toUpperCase()!=="VERWIJDER"){say("Typ eerst VERWIJDER.");return}
this.disabled=true;say("Bezig met verwijderen…",true);
try{
var f=await sb.storage.from("avatars").list(p.id);
if(f.data&&f.data.length)await sb.storage.from("avatars").remove(f.data.map(function(x){return p.id+"/"+x.name}));
var r=await sb.rpc("delete_my_account");
if(r.error)throw r.error;
if(appChan){sb.removeChannel(appChan);appChan=null;appSub=false}
leave();
await sb.auth.signOut();mode="login";auth();say("Je account is verwijderd.",true)
}catch(e){this.disabled=false;say("Verwijderen lukt niet. Probeer het later opnieuw.")}}}

async function verifyReq(p){
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Instellingen</button></div><div class="card" id="vr"><div class="small c">Laden…</div></div>';
$("#bk").onclick=function(){settings(p)};
var g=await sb.from("verification_requests").select("status,created_at").order("created_at",{ascending:false}).limit(1);
var box=$("#vr");
if(g.error){box.innerHTML='<div class="small c">Laden lukt niet.</div>';return}
var st=g.data&&g.data[0]?g.data[0].status:null;
if(st==="pending"){box.innerHTML='<h3 style="margin:0 0 8px">Aanvraag in behandeling</h3><div class="small">We nemen contact op met je management om te bevestigen dat dit account echt van jou is. Dit kan een paar dagen duren.</div>';return}
var note=st==="rejected"?'<div class="msg c" style="margin-bottom:10px">Je vorige aanvraag is niet goedgekeurd. Je kunt opnieuw aanvragen met meer gegevens.</div>':'';
box.innerHTML=note+'<h3 style="margin:0 0 6px">Verificatie aanvragen</h3><div class="small">Het vinkje is voor bekende personen. We controleren je aanvraag via je management.</div>'
+'<label>Volledige naam</label><input type="text" id="v1" maxlength="80">'
+'<label>Waar ben je bekend van?</label><input type="text" id="v2" maxlength="120" placeholder="bijv. presentatrice, zangeres">'
+'<label>Instagram-account</label><input type="text" id="v3" maxlength="80" placeholder="@naam">'
+'<label>TikTok-account</label><input type="text" id="v4" maxlength="80" placeholder="@naam">'
+'<label>Andere geverifieerde accounts (optioneel)</label><input type="text" id="v5" maxlength="200">'
+'<label>Jouw e-mailadres</label><input type="email" id="v6" maxlength="120">'
+'<label>Naam van je management of bureau</label><input type="text" id="v7" maxlength="120" placeholder="of: geen management">'
+'<label>E-mailadres of telefoon van je management</label><input type="text" id="v8" maxlength="120">'
+'<button class="btn" id="vs">Aanvraag versturen</button><div id="msg"></div>';
$("#vs").onclick=async function(){
function V(i){return $("#v"+i).value.trim()}
if(!V(1)||!V(2)||!V(6)||(!V(3)&&!V(4))){say("Vul minstens je naam, waar je bekend van bent, e-mail en een Instagram of TikTok in.");return}
this.disabled=true;
var i=await sb.from("verification_requests").insert({full_name:V(1),known_for:V(2),instagram:V(3)||null,tiktok:V(4)||null,other_accounts:V(5)||null,contact_email:V(6),mgmt_name:V(7)||null,mgmt_contact:V(8)||null});
if(i.error){this.disabled=false;say("Versturen lukt niet. Probeer het later opnieuw.");return}
box.innerHTML='<h3 style="margin:0 0 8px">Aanvraag verstuurd ✓</h3><div class="small">Bedankt! We nemen contact op met je management om dit te bevestigen.</div>'}}

function settings(p){
var v=p.verification==="verified";
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Profiel</button></div><div class="card c"><div class="avatar" id="av">'+avh(p)+'</div><button class="back" id="ph">Foto wijzigen</button><input type="file" id="fi" accept="image/*" hidden></div>'
+'<div class="card" style="margin-top:12px"><label style="margin-top:0">Gebruikersnaam</label><div style="font-size:16px;font-weight:600">@'+esc(p.username)+'</div><div class="small" style="margin-top:2px">Je gebruikersnaam is vast en kan niet worden gewijzigd.</div><label>Stad</label><input type="text" id="ct" maxlength="30" value="'+qa(p.city)+'" placeholder="bijv. Amsterdam">'
+(v?'<label>Wat je doet</label><input type="text" id="oc" maxlength="30" value="'+qa(p.occupation)+'" placeholder="bijv. presentatrice">':'<p class="small">Met een vinkje kun je hier tonen wat je doet.</p>')
+'<button class="btn" id="sv">Opslaan</button><div id="msg"></div></div>'+(v?'':'<button class="btn ghost" id="vq">Verificatie aanvragen</button>')+'<button class="btn ghost" id="bl">Geblokkeerde leden</button><button class="btn ghost" id="lo">Uitloggen</button><div class="c" style="margin-top:14px"><button class="back" id="g1">Voorwaarden</button> · <button class="back" id="g2">Privacy</button></div><div class="c"><button class="back" id="dz" style="color:#c96a6a;font-weight:500">Account verwijderen</button></div>';
$("#g1").onclick=function(){legal("terms")};$("#g2").onclick=function(){legal("privacy")};$("#dz").onclick=function(){delAcc(p)};
$("#bk").onclick=function(){profile(p)};$("#bl").onclick=function(){blocked(p)};if(!v)$("#vq").onclick=function(){verifyReq(p)};
$("#ph").onclick=function(){$("#fi").click()};
$("#fi").onchange=async function(){var f=this.files[0];if(!f)return;say("Foto uploaden…",true);
try{var url=await uploadAvatar(f,p.id);var u=await sb.from("profiles").update({avatar_url:url}).eq("id",p.id).select().single();
if(u.data){p=u.data;$("#av").innerHTML=avh(p);say("✓ Foto opgeslagen",true)}else say("Opslaan lukt niet.")}catch(e){say("Foto uploaden lukt niet.")}};
$("#sv").onclick=async function(){
var d={city:$("#ct").value.trim()||null};if(v)d.occupation=($("#oc").value.trim())||null;
this.disabled=true;
var u=await sb.from("profiles").update(d).eq("id",p.id).select().single();
if(u.data){profile(u.data,"✓ Opgeslagen")}else{this.disabled=false;say("Opslaan lukt niet.")}};
$("#lo").onclick=async function(){if(appChan){sb.removeChannel(appChan);appChan=null;appSub=false}await sb.auth.signOut();mode="login";auth()}}

var PLANS=["bronze","gold","diamond"],chan=null,pchan=null,homeChans=[],appChan=null,appN=0,myYear=null;
function dot(n){return '<span class="dot'+(n?' on':'')+'">●</span> '}
function showOnline(){var e=document.getElementById("ao");if(e)e.innerHTML=dot(appN)+appN+(appN===1?" lid online":" leden online")}
var curRoom=null,appSub=false;
function setRoom(s){curRoom=s;if(appChan&&appSub)appChan.track({room:s})}
function counts(){var st=appChan?appChan.presenceState():{},m={},n=0;
Object.keys(st).forEach(function(k){n++;var ms=st[k],r=ms.length?ms[ms.length-1].room:null;if(r)m[r]=(m[r]||0)+1});appN=n;return m}
function paint(){var m=counts();showOnline();
document.querySelectorAll(".cnt").forEach(function(e){var n=m[e.id.slice(2)]||0;e.innerHTML=dot(n)+n+" online";e.style.fontWeight=n?"700":""});
var pc=document.getElementById("pc");if(pc&&curRoom)pc.innerHTML=dot(m[curRoom]||0)+(m[curRoom]||0)+" online"}
function startPresence(p){if(appChan)return;
appChan=sb.channel("presence-app",{config:{presence:{key:p.id}}});
appChan.on("presence",{event:"sync"},paint).subscribe(async function(st){if(st==="SUBSCRIBED"){appSub=true;await appChan.track({room:curRoom})}})}
function leave(){if(chan){sb.removeChannel(chan);chan=null}}
function master(p){return p.verification==="verified"||p.plan==="diamond"}
function planOk(r,p){
if(master(p)||r.access==="free")return true;
if(r.access==="vip")return false;
if(r.access==="age30")return !!myYear&&(new Date().getFullYear()-myYear>=30);
return PLANS.indexOf(p.plan)>=PLANS.indexOf(r.access)}
function hh(t){return String(t).slice(0,5)}
function isOpen(r){if(!r.opens)return true;
var t=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date()),o=hh(r.opens),c=hh(r.closes);
return o<c?(t>=o&&t<c):(t>=o||t<c)}
function can(r,p){return planOk(r,p)&&isOpen(r)}
function need(r,p){
var tm=r.opens?"open van "+hh(r.opens)+" tot "+hh(r.closes):"";
if(planOk(r,p))return "Gesloten, "+tm+".";
var b=r.access==="vip"?"Alleen voor verified leden en Diamond":(r.access==="age30"?"Voor leden van 30 jaar en ouder":"Vanaf "+r.access);
return b+(tm?", "+tm:"")+"."}
async function home(p){
leave();startPresence(p);setRoom(null);
var v=p.verification==="verified";
app.innerHTML=head()+'<div class="c small" id="ao" style="margin:-12px 0 12px"></div><div class="top"><span><span class="mini">'+avh(p)+'</span><b>@'+esc(p.username)+'</b>'+(v?'<span class="ck">✓</span>':'')+' <span class="small">· '+esc(v?"verified":p.plan)+'</span></span><button class="back" id="pf">Mijn profiel</button></div><input type="text" id="sq" placeholder="🔍 Zoek leden…" maxlength="20" autocapitalize="none" autocomplete="off" style="margin-bottom:10px"><div id="sr"></div><div id="rl" class="small c">Laden…</div>';
$("#pf").onclick=function(){profile(p)};paint();
var st=null,qn=0;
$("#sq").oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,"").slice(0,20);var q=this.value;clearTimeout(st);var box=$("#sr");
if(q.length<2){box.innerHTML="";return}
st=setTimeout(async function(){var n=++qn;
var g=await sb.from("profiles").select("id,username,verification,avatar_url,city,occupation").ilike("username","%"+q.replace(/_/g,"\\_")+"%").neq("id",p.id).limit(15);
if(n!==qn)return;
var bl=await sb.from("blocks").select("blocked"),bs={};(bl.data||[]).forEach(function(x){bs[x.blocked]=1});
var rows=(g.data||[]).filter(function(u){return !bs[u.id]});
if(g.error){box.innerHTML='<div class="small c" style="margin-bottom:10px">Zoeken lukt niet.</div>';return}
if(!rows.length){box.innerHTML='<div class="small c" style="margin-bottom:10px">Geen leden gevonden.</div>';return}
box.innerHTML='<div class="card" style="padding:4px 14px;margin-bottom:12px">'+rows.map(function(u,i){var v=u.verification==="verified",sub=[v?u.occupation:"",u.city].filter(Boolean).join(" · ");
return '<button class="back" data-i="'+i+'" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0"><span class="mini">'+avh(u)+'</span><span><b>@'+esc(u.username)+'</b>'+(v?'<span class="ck">✓</span>':'')+'<span class="small" style="display:block;font-weight:400">'+esc(sub)+'</span></span></button>'}).join("")+'</div>';
box.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){member(rows[+b.dataset.i].id,p,function(){home(p)})}})},300)};
var g=await sb.from("rooms").select("*").order("sort");
if(g.error||!g.data){$("#rl").textContent="Chatrooms laden lukt niet.";return}
var h="";g.data.forEach(function(r,i){var ok=can(r,p);
h+='<button class="room'+(r.access==="vip"?' vip':'')+(ok?'':' lock')+'" data-i="'+i+'"><span class="ic">'+(ok?(r.access==="vip"?"✦":"💬"):"🔒")+'</span><span><b>'+esc(r.name)+'</b><span class="small">'+esc(ok?r.description:need(r,p))+'</span></span><span class="cnt" id="c-'+r.slug+'">'+dot(0)+'0 online</span></button>'});
$("#rl").className="";$("#rl").innerHTML=h;
document.querySelectorAll(".room").forEach(function(b){b.onclick=function(){room(g.data[+b.dataset.i],p)}});
paint()}

async function room(r,p){
leave();
var ok=can(r,p);
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Chatrooms</button><span><b>'+esc(r.name)+'</b> <span class="small" id="pc"></span></span></div>'
+(ok?'<div class="card" style="padding:0"><div id="msgs"></div></div><div class="send"><input type="text" id="tx" maxlength="500" placeholder="Schrijf een bericht…" autocomplete="off"><button class="btn" id="sd">Stuur</button></div><div id="msg"></div>'
:'<div class="card c"><div style="font-size:30px">🔒</div><p><b>'+esc(r.name)+'</b></p><p class="small">'+esc(need(r,p))+'</p></div>');
$("#bk").onclick=function(){home(p)};
if(!ok)return;
var box=$("#msgs"),seen={},SEL="id,body,created_at,user_id,profiles(username,verification,avatar_url)";
function add(m){if(!m||seen[m.id])return;seen[m.id]=1;var me=m.user_id===p.id,pr=m.profiles||{};
var d=document.createElement("div");d.className="b"+(me?" me":"");
d.innerHTML='<div class="n"><span class="who" style="cursor:pointer"><span class="mini sm">'+avh(pr)+'</span>@'+esc(pr.username||"?")+(pr.verification==="verified"?'<span class="ck">✓</span>':'')+'</span></div>'+esc(m.body);
d.querySelector(".who").onclick=function(){member(m.user_id,p,function(){room(r,p)})};
d.dataset.uid=m.user_id;
if(!me){var fb=document.createElement("button");fb.className="fl";fb.textContent="⋯";fb.setAttribute("aria-label","Melden of blokkeren");fb.onclick=function(){menu(m,pr)};d.querySelector(".n").appendChild(fb)}
box.appendChild(d);box.scrollTop=box.scrollHeight}
function menu(m,pr){
var o=document.createElement("div");o.className="ov";
function close(){o.remove()}
function main(){o.innerHTML='<div class="sheet"><b>@'+esc(pr.username||"?")+'</b><button class="btn ghost" id="a1">Bericht melden</button><button class="btn ghost" id="a2">Blokkeren</button><button class="back" id="a3" style="width:100%;margin-top:6px">Annuleren</button></div>';
o.querySelector("#a1").onclick=reasons;o.querySelector("#a2").onclick=blk;o.querySelector("#a3").onclick=close}
function reasons(){var R=[["spam","Spam of reclame"],["intimidatie","Intimidatie of pesten"],["seksueel","Seksuele of ongewenste inhoud"],["minderjarig","Lijkt minderjarig"],["anders","Anders"]];
o.innerHTML='<div class="sheet"><b>Waarom meld je dit?</b>'+R.map(function(r){return '<button class="btn ghost" data-r="'+r[0]+'">'+r[1]+'</button>'}).join("")+'<button class="back" id="a3" style="width:100%;margin-top:6px">Terug</button></div>';
o.querySelector("#a3").onclick=main;
o.querySelectorAll("[data-r]").forEach(function(b){b.onclick=async function(){
var i=await sb.from("reports").insert({reported:m.user_id,message_id:m.id,message_text:String(m.body).slice(0,500),room:r.slug,reason:b.dataset.r});
o.innerHTML='<div class="sheet c"><b>'+(i.error?"Melden lukt niet. Probeer het later opnieuw.":"Bedankt, we kijken ernaar.")+'</b></div>';setTimeout(close,1600)}})}
async function blk(){
var i=await sb.from("blocks").insert({blocked:m.user_id});
if(i.error&&i.error.code!=="23505"){o.innerHTML='<div class="sheet c"><b>Blokkeren lukt niet.</b></div>';setTimeout(close,1600);return}
box.querySelectorAll('[data-uid="'+m.user_id+'"]').forEach(function(e){e.remove()});
o.innerHTML='<div class="sheet c"><b>@'+esc(pr.username||"?")+' is geblokkeerd.</b><p class="small">Je ziet geen berichten meer van dit lid. Je kunt dit terugdraaien via Instellingen.</p></div>';setTimeout(close,1900)}
main();document.body.appendChild(o)}
var g=await sb.from("messages").select(SEL).eq("room",r.slug).order("created_at",{ascending:false}).limit(50);
if(g.data){g.data.reverse().forEach(add)}
if(!box.children.length)box.innerHTML='<div class="small c" style="margin:auto">Nog geen berichten. Zeg als eerste hallo!</div>';
chan=sb.channel("room-"+r.slug).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room=eq."+r.slug},async function(e){
var q=await sb.from("messages").select(SEL).eq("id",e.new.id).single();if(q.data){var f=box.querySelector(".small.c");if(f)box.innerHTML="";add(q.data)}}).subscribe();
setRoom(r.slug);paint();
async function send(){var t=$("#tx").value.trim();if(!t)return;$("#sd").disabled=true;
var i=await sb.from("messages").insert({room:r.slug,body:t}).select(SEL).single();
$("#sd").disabled=false;
if(i.error){say("Versturen lukt niet.");return}
$("#tx").value="";var f=box.querySelector(".small.c");if(f)box.innerHTML="";add(i.data);$("#tx").focus()}
$("#sd").onclick=send;$("#tx").onkeydown=function(e){if(e.key==="Enter")send()}}

async function gate(p,user){
myYear=null;
var q=await sb.from("private_profiles").select("birth_year").eq("id",user.id).maybeSingle();
if(q.data){myYear=q.data.birth_year;home(p);return}
var by=(user.user_metadata||{}).birth_year;
if(by){var i=await sb.from("private_profiles").insert({id:user.id,birth_year:by});if(!i.error){myYear=by;home(p);return}}
askYear(p,user)}
function askYear(p,user){
app.innerHTML=head()+'<div class="card"><b>Nog één ding</b><p class="small">Vul je geboortejaar in. Het wordt nergens getoond en bepaalt welke kamers voor jou open zijn. Je kunt het later niet meer wijzigen.</p><label>Geboortejaar</label><input type="text" id="by" inputmode="numeric" maxlength="4" placeholder="bijv. 1995"><button class="btn" id="go">Opslaan</button><div id="msg"></div></div>';
$("#go").onclick=async function(){var by=$("#by").value.trim();
if(!/^(19|20)\d\d$/.test(by)||+by>new Date().getFullYear()-18){say("Alleen voor 18+. Vul een geldig geboortejaar in.");return}
var i=await sb.from("private_profiles").insert({id:user.id,birth_year:+by});
if(i.error){say("Opslaan lukt niet.");return}
myYear=+by;home(p)}}

async function start(){
var c=cfg();
if(!c||!window.supabase){setup();return}
if(!sb)sb=window.supabase.createClient(c.url,c.key);
var s=await sb.auth.getSession();
if(s.data&&s.data.session){afterLogin(s.data.session.user)}else auth()}
start();
</script>
