function take(arr,tag){arr.forEach(function(u){var k=(u.username||"").toLowerCase();if(!k||seenN[k]||k.indexOf(q)<0)return;seenN[k]=1;out.push({username:u.username,verification:u.verification,avatar_url:u.avatar_url,plan:u.plan,tag:tag,pre:k.indexOf(q)===0?0:1})})}
take(fol,"volg je");take(Object.keys(known).map(function(k){return known[k]}),"in deze kamer");if(extra)take(extra,"");
out.sort(function(a,b){return a.pre-b.pre});return out.slice(0,6)}
tx.oninput=async function(){var t=tok();if(!t){hideSug();return}
var l=match(t.q);showSug(l);
if(t.q.length>=2&&l.length<6){var n=++sq;
var g=await sb.from("profiles").select("username,verification,avatar_url,plan").ilike("username",t.q.replace(/_/g,"\\_")+"%").neq("id",p.id).limit(6);
if(n!==sq||!tok())return;showSug(match(t.q,g.data||[]))}};
tx.onblur=function(){setTimeout(hideSug,200)};
tx.onkeydown=function(e){
if(e.key==="Escape"){hideSug();return}
if(e.key==="Enter"){if(!sug.hidden&&cur.length){e.preventDefault();pick(cur[0]);return}send()}}}

var WACHTLIJST=false;
function waitlist(){
app.innerHTML='<div class="hero"><div class="orb"></div><div class="wm">Auré</div><div class="gl"></div><div class="tg">The community</div></div>'
+'<div id="wl"><div class="c" style="margin:0 0 18px"><div class="wlh">De kamers gaan binnenkort open</div><div class="wlt">Zet je op de lijst en hoor als eerste wanneer Auré opent. Iedereen komt op dezelfde avond binnen.</div></div>'
+'<div class="card glass"><label style="margin-top:0">E-mail</label><input type="email" id="we" maxlength="254" autocapitalize="none" autocomplete="email" placeholder="jij@voorbeeld.nl"><div class="chk"><input type="checkbox" id="wa"><span>Ik ben 18 jaar of ouder</span></div><button class="btn" id="wg">Zet me op de lijst</button><div class="small c" style="margin-top:10px">We gebruiken je e-mailadres alleen om je te laten weten wanneer Auré opent. <a href="#" id="wp">Privacy</a></div><div id="msg"></div></div>'
+'<div class="c small" id="wc" style="margin-top:16px"></div></div>'
+'<div class="c" style="margin-top:10px"><button class="back" id="wl2">Al uitgenodigd? Inloggen</button></div><div class="foot">ALLEEN VOOR 18+</div>';
$("#wl2").onclick=function(){mode="login";auth()};
$("#wp").onclick=function(e){e.preventDefault();legal("privacy")};
sb.rpc("waitlist_count").then(function(r){var n=r.data||0,el=document.getElementById("wc");if(el&&n>=50)el.innerHTML='<span style="color:var(--gold)">●</span> <b style="color:var(--ink)">'+n.toLocaleString("nl-NL")+'</b> mensen wachten al'});
$("#wg").onclick=async function(){
var em=$("#we").value.trim().toLowerCase();
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){say("Vul een geldig e-mailadres in.");return}
if(!$("#wa").checked){say("Alleen voor 18+.");return}
this.disabled=true;
var r=await sb.rpc("join_waitlist",{p_email:em});
if(r.error||!r.data){this.disabled=false;say("Aanmelden lukt niet. Probeer het later opnieuw.");return}
$("#wl").innerHTML='<div class="card glass c" style="padding:28px 20px 18px"><div class="small" style="letter-spacing:.24em">JE STAAT OP DE LIJST</div><div class="wln">#'+(+r.data).toLocaleString("nl-NL")+'</div><div class="wlt" style="margin-top:0">We mailen je zodra de kamers opengaan. Nodig je vrienden uit, dan zitten jullie die avond samen in de kamers.</div><button class="btn ghost" id="wi">Nodig vrienden uit</button><div id="msg"></div></div>';
$("#wi").onclick=async function(){
var url=location.origin+location.pathname+"#wachtlijst";
if(navigator.share){try{await navigator.share({title:"Auré",text:"Zet je ook op de wachtlijst van Auré",url:url})}catch(e){}return}
try{await navigator.clipboard.writeText(url);this.textContent="Link gekopieerd ✓"}catch(e){say(url,true)}}}}

function enter(p){var k="aure_welkom_"+p.id,seen=false;try{seen=!!localStorage.getItem(k)}catch(e){}if(seen)home(p);else welcome(p)}
async function welcome(p){
var av=null;try{var a=await sb.from("rooms").select("opens,closes,days").eq("slug","avond").maybeSingle();av=a.data}catch(e){}
var when=av&&av.opens?((av.days&&av.days.length?"Elke "+av.days.map(function(d){return DAYN[d]}).join(" en ")+" ":"Elke avond ")+"om "+hh(av.opens)):"Op een vaste avond";
var S=[
{i:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',t:"Welkom bij Auré, @"+p.username,b:"Auré is een community voor 18+. Geen eindeloze feed, maar echte gesprekken met mensen uit heel Nederland."},
{i:'<path d="M4 5h16v11H9l-5 4z"/>',t:"Kies een kamer",b:"Elke kamer heeft een eigen sfeer: je regio, een thema of een exclusieve lounge. Noem iemand met @naam. Zie je iets wat niet kan? Tik op ⋯ naast een bericht om te melden of te blokkeren."},
{i:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',t:"De Avond",b:when+" komt iedereen samen in één kamer, met een host en een thema. Eén uur, iedereen tegelijk. Wat daar gebeurt, blijft daar."}];
var n=0;
function draw(){var x=S[n],last=n===S.length-1;
app.innerHTML='<div class="hero" style="padding-bottom:8px"><div class="orb"></div><div class="wm" style="font-size:34px">Auré</div><div class="gl"></div><div class="tg">The community</div></div>'
+'<div class="card glass c" style="padding:28px 20px 20px"><div class="wsi"><svg viewBox="0 0 24 24">'+x.i+'</svg></div><h2 class="wst">'+esc(x.t)+'</h2><p class="wsb">'+esc(x.b)+'</p>'
+'<div class="wd">'+S.map(function(_,j){return '<i class="'+(j===n?'on':'')+'"></i>'}).join("")+'</div>'
+'<button class="btn" id="wn">'+(last?'Naar de kamers':'Volgende')+'</button>'+(last?'':'<button class="back" id="ws" style="width:100%;margin-top:8px">Overslaan</button>')+'</div>';
$("#wn").onclick=function(){if(last)done();else{n++;draw()}};
if(!last)$("#ws").onclick=done}
function done(){try{localStorage.setItem("aure_welkom_"+p.id,"1")}catch(e){}home(p)}
draw()}

async function gate(p,user){
myYear=null;
if(p&&p.banned){app.innerHTML=head()+'<div class="card c"><b>Je account is gepauzeerd</b><p class="small">Je account is gepauzeerd na meldingen van andere leden. Denk je dat dit niet klopt? Neem contact met ons op'+(LEGAL_MAIL?' via '+esc(LEGAL_MAIL):'')+'.</p><button class="btn ghost" id="lo2">Uitloggen</button></div>';$("#lo2").onclick=async function(){await sb.auth.signOut();mode="login";auth()};return}
ISADMIN=false;sb.rpc("is_admin").then(function(r){ISADMIN=!!r.data;adminBadge()});
var q=await sb.from("private_profiles").select("birth_year").eq("id",user.id).maybeSingle();
if(q.data){myYear=q.data.birth_year;enter(p);return}
var by=(user.user_metadata||{}).birth_year;
if(by){var i=await sb.from("private_profiles").insert({id:user.id,birth_year:by});if(!i.error){myYear=by;enter(p);return}}
askYear(p,user)}
function askYear(p,user){
app.innerHTML=head()+'<div class="card"><b>Nog één ding</b><p class="small">Vul je geboortejaar in. Het wordt nergens getoond en bepaalt welke kamers voor jou open zijn. Je kunt het later niet meer wijzigen.</p><label>Geboortejaar</label><input type="text" id="by" inputmode="numeric" maxlength="4" placeholder="bijv. 1995"><button class="btn" id="go">Opslaan</button><div id="msg"></div></div>';
$("#go").onclick=async function(){var by=$("#by").value.trim();
if(!/^(19|20)\d\d$/.test(by)||+by>new Date().getFullYear()-18){say("Alleen voor 18+. Vul een geldig geboortejaar in.");return}
var i=await sb.from("private_profiles").insert({id:user.id,birth_year:+by});
if(i.error){say("Opslaan lukt niet.");return}
myYear=+by;enter(p)}}

async function start(){
var c=cfg();
if(!c||!window.supabase){setup();return}
if(!sb)sb=window.supabase.createClient(c.url,c.key);
var s=await sb.auth.getSession();
if(s.data&&s.data.session){afterLogin(s.data.session.user)}else if(WACHTLIJST||wlLink())waitlist();else auth()}
function wlLink(){return /wachtlijst/i.test(location.hash+location.search)}
window.addEventListener("hashchange",function(){if(wlLink()&&sb)sb.auth.getSession().then(function(s){if(!(s.data&&s.data.session))waitlist()})});
start();
</script>
