<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auré</title>
<style>
:root{--bg:#f5f3f1;--card:#fdfcfb;--ink:#4a403c;--mut:#9a8b84;--acc:#9c7545;--gold:#c9a96e;--line:#e6dfd9;--other:#ece6e1;--marble:radial-gradient(circle at 18% 8%,rgba(255,255,255,.95),transparent 55%),linear-gradient(118deg,transparent 38%,rgba(150,135,125,.13) 39%,transparent 40.2%),linear-gradient(112deg,transparent 52%,rgba(201,169,110,.16) 52.6%,transparent 53.6%)}
@media (prefers-color-scheme:dark){:root{--bg:#211d1b;--card:#2c2725;--ink:#f1ebe6;--mut:#b8aca4;--line:#433a36;--other:#383230;--marble:linear-gradient(118deg,transparent 38%,rgba(201,169,110,.08) 39%,transparent 40.2%)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--marble),var(--bg);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:440px;margin:0 auto;padding:16px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:26px;letter-spacing:.16em;text-transform:uppercase;text-align:center;margin:18px 0 6px}
.logo{display:inline-block;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#e9d3a6,#c9a96e 55%,#9c7545);box-shadow:0 0 0 3px rgba(201,169,110,.25);margin-right:10px;vertical-align:middle}
.sub{text-align:center;color:var(--mut);margin-bottom:20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(120,90,50,.07)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:16px;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);font-weight:700}
.msg{margin-top:12px;font-size:14px;color:var(--acc)}.ok{color:#5f8a5f}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px}
.avatar{overflow:hidden;width:92px;height:92px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;font:34px Georgia,serif;color:#fff;background:linear-gradient(135deg,#e9d3a6,#c9a96e 55%,#9c7545);box-shadow:0 0 0 2px var(--gold)}
.ck{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:10px;margin-left:6px;vertical-align:middle}
.avatar img,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini{display:inline-grid;place-items:center;overflow:hidden;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#e9d3a6,#c9a96e 55%,#9c7545);color:#fff;font:14px Georgia,serif;vertical-align:middle;margin-right:8px}
.mini.sm{width:20px;height:20px;font-size:11px;margin-right:6px}
.dot{color:#9a8b84}.dot.on{color:#3fb97a}
.fl{float:right;background:none;border:0;color:var(--mut);font-size:18px;line-height:1;cursor:pointer;padding:0 0 0 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:440px;border:1px solid var(--line)}
.sheet .btn{margin-top:10px}
.cnt{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;padding-left:8px}
.c{text-align:center}.small{font-size:12px;color:var(--mut)}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.room b{display:block}.room .ic{font-size:20px;width:28px;text-align:center}.room.vip{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.room.lock{opacity:.6}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
#msgs{height:55vh;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--other);font-size:15px;word-wrap:break-word}
.b .n{font-size:12px;color:var(--mut);margin-bottom:2px}.b.me{align-self:flex-end;background:var(--acc);color:#fff}.b.me .n{color:rgba(255,255,255,.8)}
.hero{text-align:center;padding:30px 0 24px;position:relative;animation:fi .9s ease both}
.hero:before{content:"";position:absolute;left:50%;top:-10px;width:300px;height:300px;transform:translateX(-50%);background:radial-gradient(circle,rgba(201,169,110,.26),transparent 66%)}
.hero>*{position:relative}
.orb{width:46px;height:46px;border-radius:50%;margin:0 auto 20px;background:linear-gradient(135deg,#f3e2bb,#c9a96e 55%,#9c7545);box-shadow:0 0 0 7px rgba(201,169,110,.16),0 0 42px rgba(201,169,110,.5)}
.wm{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:46px;letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;line-height:1}
.gl{width:70px;height:1px;margin:18px auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tg{color:var(--mut);font-size:13px;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase}
.card.glass{border-color:rgba(201,169,110,.45);box-shadow:0 12px 40px rgba(120,90,50,.14),0 0 0 1px rgba(201,169,110,.12);animation:fi 1s .15s ease both}
.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--mut);letter-spacing:.08em}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.room{padding:15px 16px;border-radius:20px;gap:14px;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(120,90,50,.06)}
.room:active{transform:scale(.985)}
.ico{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);background:rgba(201,169,110,.09)}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.room.lock{opacity:1}.room.lock .ico{color:var(--mut);border-color:var(--line);background:none}.room.lock b{color:var(--mut)}
.room.vip{background:linear-gradient(135deg,rgba(201,169,110,.16),transparent 70%),var(--card)}
.room .tx{display:block;flex:1;min-width:0}.room .tx .small{display:block;margin-top:2px}
.sec{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin:22px 4px 0}
.sec:first-child{margin-top:6px}
.room{position:relative;overflow:hidden;padding:17px 18px 17px 24px;background:linear-gradient(110deg,color-mix(in srgb,var(--t,#c9a96e) 13%,transparent),transparent 72%),var(--card)}
.room:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--t,#c9a96e)}
.room b{font:italic 400 17px Georgia,"Times New Roman",serif;letter-spacing:.015em;color:var(--ink)}.room .tx .small{font-size:12px;letter-spacing:.02em;margin-top:3px}
.room.lock{opacity:.72}.room.lock:before{opacity:.4}
.room.vip{background:linear-gradient(110deg,color-mix(in srgb,var(--t,#c9a96e) 20%,transparent),transparent 72%),var(--card)}
:root{--vg:#9a7424}
@media (prefers-color-scheme:dark){:root{--vg:#e8c97a}}
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.hd .t{text-align:center}.hd .t i{font:italic 400 19px Georgia,"Times New Roman",serif;display:block}
.hd .sp{width:32px}
.pill{display:flex;align-items:center;gap:8px;margin-top:12px;padding:6px 6px 6px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.pill input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:0;padding:8px 0}
.pill button{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:18px;cursor:pointer}
.pill button:disabled{opacity:.5}
#msgs{gap:0}.g{margin:7px 0}.g.me{text-align:right}
.g .nm{font-size:12px;font-weight:600;margin:0 0 3px 40px;cursor:pointer;text-align:left}
.g .row{display:flex;gap:8px;align-items:flex-end;margin-top:3px}
.g.me .row{justify-content:flex-end}
.g .slot{flex:none;width:30px;height:30px;cursor:pointer}
.av2{display:grid;place-items:center;overflow:hidden;width:30px;height:30px;border-radius:50%;color:#fff;font:13px Georgia,serif;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.av2 img{width:100%;height:100%;object-fit:cover;display:block}
.g .bb{padding:9px 13px;border-radius:17px;background:var(--other);font-size:15px;line-height:1.4;max-width:100%;word-wrap:break-word;text-align:left}
.g .col{max-width:78%}
.g .row.f .bb{border-bottom-left-radius:6px}
.g.me .row.f .bb{border-bottom-left-radius:17px;border-bottom-right-radius:6px}
.g.me .bb{background:var(--acc);color:#fff}
.g .row.ment .bb{box-shadow:0 0 0 1.5px var(--gold);background:linear-gradient(0deg,rgba(201,169,110,.15),rgba(201,169,110,.15)),var(--other)}
.g .mn{color:var(--vg)}.g.me .mn{color:#fff}
.g .tm2{font-size:11px;color:var(--mut);margin:2px 0 0 40px;text-align:left}.g.me .tm2{margin:3px 4px 0 0;text-align:right}
.g .fl{align-self:center;float:none;padding:0 4px;font-size:16px;opacity:.6}
.nb{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;border:0;border-radius:99px;background:var(--acc);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.bn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:412px;z-index:20;background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;font-size:14px;animation:bi .35s ease both}
.bn b{color:var(--vg)}.bn .small{display:block;margin-top:2px}
@keyframes bi{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.nbd{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#c0534b;color:#fff;font:600 11px system-ui,sans-serif;padding:0 6px;margin-left:10px;box-shadow:0 1px 4px rgba(0,0,0,.25);vertical-align:middle;font-style:normal;letter-spacing:0}
.nbd[hidden]{display:none}
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;z-index:6}
.sug[hidden]{display:none}
.sg{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sg+.sg{border-top:1px solid var(--line)}.sg:active{background:var(--other)}.sg .small{margin-left:auto}
.pc{position:relative;overflow:hidden;margin-top:12px;padding:20px 18px 18px 24px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(110deg,color-mix(in srgb,var(--t) 14%,transparent),transparent 72%),var(--card)}
.pc:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--t)}
.pc.me{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pc h3{margin:0;font:italic 400 21px Georgia,"Times New Roman",serif;display:flex;align-items:center;gap:10px}
.pc .pr{font-size:13px;color:var(--mut);margin:2px 0 10px}
.pc ul{list-style:none;margin:0;padding:0}
.pc li{display:flex;gap:10px;align-items:baseline;font-size:14px;margin:7px 0;line-height:1.35}
.pc li:before{content:"✓";color:var(--vg);font-size:12px;flex:none}
.pc li.soon{color:var(--mut)}
.tg2{font:600 10px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);color:var(--vg);border-radius:99px;padding:3px 8px;font-style:normal}
.pc li .tg2{margin-left:auto;flex:none}
.avatar{box-shadow:0 0 0 2px var(--line)}
.rg-gold{box-shadow:0 0 0 2px var(--gold)!important}
.rg-dia{box-shadow:0 0 0 2px #a9cfe4,0 0 12px rgba(143,184,208,.65)!important}
.av2.rg-gold,.av2.rg-dia,.mini.rg-gold,.mini.rg-dia{border-radius:50%}
.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1}.send button{width:auto;margin:0;padding:0 20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
var sb=null,mode="login";
var app=document.getElementById("app");
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function $(q){return document.querySelector(q)}
function head(){return '<div class="brand"><span class="logo"></span>Auré</div><div class="sub">The community</div>'}
var CFG={url:"https://ftjhgxkyihfuhqckalrp.supabase.co",key:"sb_publishable_nMdgdkv1NlA0-VUyIH6EPw_ngRqPEPd"};
function cfg(){return CFG}
function say(t,ok){var m=$("#msg");if(m){m.className="msg"+(ok?" ok":"");m.textContent=t}}

function safeUrl(u){var c=cfg();return(typeof u==="string"&&c&&u.indexOf(c.url+"/storage/v1/object/public/avatars/")===0)?u.replace(/"/g,"%22"):""}
function avh(p){var u=safeUrl(p.avatar_url);return u?'<img src="'+u+'" alt="">':esc(((p.username||"?")[0]||"?").toUpperCase())}
async function uploadAvatar(file,uid){
var img=await new Promise(function(res,rej){var i=new Image(),u=URL.createObjectURL(file);i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u});
var s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=480;
c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,480,480);
var blob=await new Promise(function(r){c.toBlob(r,"image/jpeg",.85)});
var path=uid+"/"+Date.now()+".jpg";
var up=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
if(up.error)throw up.error;
return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl}

function setup(){
app.innerHTML=head()+'<div class="card"><b>Koppel je database</b><p class="small">Eenmalig. Plak hier de gegevens van je Supabase-project. Gebruik alleen de <b>Project URL</b> en de <b>publishable key</b> (begint met sb_publishable). Plak hier nooit de secret key.</p><label>Project URL</label><input type="text" id="u" placeholder="https://jouwproject.supabase.co" autocapitalize="none"><label>Publishable key</label><input type="text" id="k" placeholder="sb_publishable_…" autocapitalize="none"><button class="btn" id="go">Opslaan</button><div id="msg"></div></div>';
$("#go").onclick=function(){var u=$("#u").value.trim().replace(/\/$/,""),k=$("#k").value.trim();
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u)){say("De Project URL ziet er niet goed uit.");return}
if(/secret|service_role/i.test(k)||k.length<20){say("Dit lijkt niet de publishable key. Gebruik nooit een secret key.");return}
try{localStorage.setItem("aure_cfg",JSON.stringify({url:u,key:k}))}catch(e){say("Opslaan lukt niet in deze browser.");return}
start()}}

function auth(){
var reg=mode==="register";
app.innerHTML='<div class="hero"><div class="orb"></div><div class="wm">Auré</div><div class="gl"></div><div class="tg">The community</div></div><div class="card glass"><div class="tabs"><button id="t1" class="'+(reg?'':'on')+'">Inloggen</button><button id="t2" class="'+(reg?'on':'')+'">Account maken</button></div>'
+(reg?'<label>Gebruikersnaam</label><input type="text" id="un" placeholder="bijv. sanne.s" maxlength="20" autocapitalize="none" autocomplete="off"><label>Geboortejaar</label><input type="text" id="by" inputmode="numeric" maxlength="4" placeholder="bijv. 1995" autocomplete="off"><div class="small" style="margin-top:4px">Wordt nergens getoond. Alleen om te bepalen welke kamers voor jou open zijn.</div>':'')
+'<label>E-mail</label><input type="email" id="em" autocapitalize="none" autocomplete="email"><label>Wachtwoord</label><input type="password" id="pw" autocomplete="'+(reg?'new-password':'current-password')+'">'
+(reg?'<div class="chk"><input type="checkbox" id="age"><span>Ik ben 18 jaar of ouder. (Testversie: de echte leeftijdscheck volgt.)</span></div><div class="chk"><input type="checkbox" id="tm"><span>Ik ga akkoord met de <a href="#" id="l1">voorwaarden</a> en de <a href="#" id="l2">privacyverklaring</a>.</span></div>':'')
+'<button class="btn" id="go">'+(reg?'Account maken':'Inloggen')+'</button><div id="msg"></div></div><div class="foot">ALLEEN VOOR 18+</div>';
if(reg){$("#l1").onclick=function(e){e.preventDefault();legal("terms")};$("#l2").onclick=function(e){e.preventDefault();legal("privacy")}}
$("#t1").onclick=function(){mode="login";auth()};$("#t2").onclick=function(){mode="register";auth()};
if(reg){$("#un").oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,"").slice(0,20)}}
$("#go").onclick=async function(){
var em=$("#em").value.trim(),pw=$("#pw").value;
if(!em||pw.length<8){say("Vul je e-mail in en kies een wachtwoord van minimaal 8 tekens.");return}
this.disabled=true;
try{
if(reg){
var un=$("#un").value;
if(!/^[a-z0-9._]{3,20}$/.test(un)){say("Gebruikersnaam: 3 tot 20 tekens (letters, cijfers, punt, underscore).");this.disabled=false;return}
var by=$("#by").value.trim();
if(!/^(19|20)\d\d$/.test(by)||+by>new Date().getFullYear()-18){say("Alleen voor 18+. Vul een geldig geboortejaar in.");this.disabled=false;return}
if(!$("#age").checked){say("Alleen voor 18+.");this.disabled=false;return}
if(!$("#tm").checked){say("Ga akkoord met de voorwaarden en de privacyverklaring om door te gaan.");this.disabled=false;return}
var r=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un,birth_year:+by,accepted_terms:new Date().toISOString()}}});
if(r.error){say(r.error.message);this.disabled=false;return}
if(r.data.session){await afterLogin(r.data.session.user)}
else{say("Bijna klaar! Bevestig je e-mail via de link in je mailbox en log daarna in.",true);this.disabled=false}
}else{
var l=await sb.auth.signInWithPassword({email:em,password:pw});
if(l.error){say("Inloggen lukt niet. Controleer je e-mail en wachtwoord.");this.disabled=false;return}
await afterLogin(l.data.user)}
}catch(e){say("Er ging iets mis. Probeer het opnieuw.");this.disabled=false}}}

async function afterLogin(user){
var g=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
if(g.data){gate(g.data,user);return}
var un=(user.user_metadata||{}).username;
if(un){var i=await sb.from("profiles").insert({id:user.id,username:un}).select().single();
if(i.data){gate(i.data,user);return}
choose(user,i.error&&i.error.code==="23505"?"Deze gebruikersnaam is al bezet. Kies een andere.":"")}
else choose(user,"")}

function choose(user,m){
app.innerHTML=head()+'<div class="card"><b>Kies je gebruikersnaam</b><label>Gebruikersnaam</label><input type="text" id="un" maxlength="20" autocapitalize="none"><button class="btn" id="go">Opslaan</button><div id="msg" class="msg">'+esc(m)+'</div></div>';
$("#un").oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,"").slice(0,20)};
$("#go").onclick=async function(){var un=$("#un").value;
if(!/^[a-z0-9._]{3,20}$/.test(un)){say("Minimaal 3 tekens.");return}
var i=await sb.from("profiles").insert({id:user.id,username:un}).select().single();
if(i.data){gate(i.data,user)}else say(i.error&&i.error.code==="23505"?"Deze gebruikersnaam is al bezet.":"Opslaan lukt niet.")}}

function qa(t){return esc(t).replace(/"/g,"&quot;")}
function cntLine(c){var f=c.followers||0,g=c.following||0;return '<b>'+f+'</b> '+(f===1?'volger':'volgers')+' · <b>'+g+'</b> volgend'}
async function member(id,p,back){
app.innerHTML=head()+'<div class="top"><button class="back" id="bk">← Terug</button></div><div class="card c" id="mb"><div class="small">Laden…</div></div>';
$("#bk").onclick=back;
var pr=await sb.from("profiles").select("id,username,verification,avatar_url,city,occupation,plan").eq("id",id).maybeSingle();
var box=$("#mb");

var g=await sb.from("profiles").select("id,username,verification,avatar_url,city,occupation,plan").ilike("username","%"+q.replace(/_/g,"\\_")+"%").neq("id",p.id).limit(15);
if(n!==qn)return;
var bl=await sb.from("blocks").select("blocked"),bs={};(bl.data||[]).forEach(function(x){bs[x.blocked]=1});
var rows=(g.data||[]).filter(function(u){return !bs[u.id]});
if(g.error){box.innerHTML='<div class="small c" style="margin-bottom:10px">Zoeken lukt niet.</div>';return}
if(!rows.length){box.innerHTML='<div class="small c" style="margin-bottom:10px">Geen leden gevonden.</div>';return}
box.innerHTML='<div class="card" style="padding:4px 14px;margin-bottom:12px">'+rows.map(function(u,i){var v=u.verification==="verified",sub=[v?u.occupation:"",u.city].filter(Boolean).join(" · ");
return '<button class="back" data-i="'+i+'" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0"><span class="mini'+rg(u)+'">'+avh(u)+'</span><span><b>@'+esc(u.username)+'</b>'+(v?'<span class="ck">✓</span>':'')+'<span class="small" style="display:block;font-weight:400">'+esc(sub)+'</span></span></button>'}).join("")+'</div>';
box.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){member(rows[+b.dataset.i].id,p,function(){home(p)})}})},300)};
var g=await sb.from("rooms").select("*").order("sort");
if(g.error||!g.data){$("#rl").textContent="Chatrooms laden lukt niet.";return}
roomsC=g.data;
var IC={randstad:"M3 20V10h4v10M9 20V4h5v16M16 20v-8h5v8M2 20h20",zuid:"M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1","noord-oost":"M3 9c3-3 5 3 9 0s6 3 9 0M3 15c3-3 5 3 9 0s6 3 9 0",nightlife:"M9 18V6l11-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z",creators:"M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z",gold:"M3 18L2 7l6 5 4-7 4 7 6-5-1 11zM3 21h18",latenight:"M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z",vip:"M6 3h12l4 6-10 12L2 9zM2 9h20M9 3l3 6 3-6M12 21L9 9M12 21l3-12"};
var LOCK="M6 11V8a6 6 0 0112 0v3M5 11h14v10H5z";
function icon(slug,lock){return '<span class="ico"><svg viewBox="0 0 24 24"><path d="'+(lock?LOCK:(IC[slug]||"M12 3a9 9 0 100 18 9 9 0 000-18z"))+'"/></svg></span>'}
var SECT=[["Regio\u2019s",["randstad","zuid","noord-oost"]],["Thema",["nightlife","creators"]],["Exclusief",["gold","goldclub","latenight","vip"]]];
var used={},h="";
var TONE={randstad:"#b07a70",zuid:"#c9a96e","noord-oost":"#8fa3a8",nightlife:"#8a5f86",creators:"#b98d6c",gold:"#b8a98c",goldclub:"#d6b565",latenight:"#5a5f8f",vip:"#e8d4a8"};
function card(r,i){var ok=can(r,p);used[r.slug]=1;
return '<button class="room'+(r.access==="vip"?' vip':'')+(ok?'':' lock')+'" data-i="'+i+'" style="--t:'+(TONE[r.slug]||"#c9a96e")+'"><span class="tx"><b>'+esc(r.name)+'<i class="nbd" id="b-'+r.slug+'" hidden></i></b><span class="small">'+esc(ok?r.description:need(r,p))+'</span></span><span class="cnt" id="c-'+r.slug+'">'+dot(0)+'0 online</span></button>'}
SECT.forEach(function(sc){var rows=[];g.data.forEach(function(r,i){if(sc[1].indexOf(r.slug)>-1)rows.push(card(r,i))});if(rows.length)h+='<div class="sec">'+sc[0]+'</div>'+rows.join("")});
var rest=[];g.data.forEach(function(r,i){if(!used[r.slug])rest.push(card(r,i))});if(rest.length)h+='<div class="sec">Meer</div>'+rest.join("");
$("#rl").className="";$("#rl").innerHTML=h;
document.querySelectorAll(".room").forEach(function(b){b.onclick=function(){room(g.data[+b.dataset.i],p)}});
paint();paintBadges()}

async function room(r,p){
leave();
var ok=can(r,p);
app.innerHTML='<div class="brand" style="margin:10px 0 0;font-size:20px"><span class="logo"></span>Auré</div><div class="hd"><button class="back" id="bk" aria-label="Terug naar chatrooms" style="font-size:20px;padding:6px 12px 6px 0">←</button><div class="t"><i>'+esc(r.name)+'</i><span class="small" id="pc"></span></div><span class="sp"></span></div>'
+(ok?'<div class="card" style="padding:0;position:relative"><div id="msgs"></div><button class="nb" id="nb" hidden>↓ Nieuwe berichten</button></div><div style="position:relative"><div class="sug" id="sug" hidden></div><div class="pill"><input type="text" id="tx" maxlength="500" placeholder="Schrijf een bericht…" autocomplete="off"><button id="sd" aria-label="Versturen">↑</button></div></div><div id="msg"></div>'
:'<div class="card c"><div style="font-size:30px">🔒</div><p><b>'+esc(r.name)+'</b></p><p class="small">'+esc(need(r,p))+'</p></div>');
$("#bk").onclick=function(){home(p)};
if(!ok)return;
var box=$("#msgs"),seen={},SEL="id,body,created_at,user_id,profiles(username,verification,avatar_url,plan)";
var PAL=["#7fb6a4","#8fa8d6","#b59bd6","#d9807a","#a8c27a","#7fc0cf","#9aa0b8","#c4a1a1"];
function colOf(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return PAL[h%PAL.length]}
var TF=new Intl.DateTimeFormat("nl-NL",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit"});
function fmt(b){return esc(b).replace(/@[a-z0-9._]{3,20}/gi,function(x){return '<b class="mn">'+x+'</b>'})}
var meRe=new RegExp("@"+p.username.replace(/\./g,"\\.")+"(?![a-z0-9_]|\\.[a-z0-9_])","i");
var lastG=null,lastU=null,lastT=0,lastSlot=null,known={},fol=[];
var nb=$("#nb");
function near(){return box.scrollHeight-box.scrollTop-box.clientHeight<90}
box.onscroll=function(){if(near())nb.hidden=true};
nb.onclick=function(){box.scrollTop=box.scrollHeight;nb.hidden=true};
function add(m){if(!m||seen[m.id])return;seen[m.id]=1;
var me=m.user_id===p.id,pr=m.profiles||{},v=pr.verification==="verified",col=colOf(m.user_id),was=near();
if(pr.username)known[pr.username.toLowerCase()]=pr;
var t=new Date(m.created_at).getTime(),g;
var fresh=!lastG||!box.contains(lastG)||lastU!==m.user_id||(t-lastT)>300000;
function prof(){member(m.user_id,p,function(){room(r,p)})}
if(fresh){g=document.createElement("div");g.className="g"+(me?" me":"");g.dataset.uid=m.user_id;
if(!me){var nm=document.createElement("div");nm.className="nm";nm.style.color=v?"var(--vg)":"color-mix(in srgb,"+col+" 72%,var(--ink))";
nm.innerHTML='@'+esc(pr.username||"?")+(v?'<span class="ck">✓</span>':'');nm.onclick=prof;g.appendChild(nm)}
box.appendChild(g);lastG=g;lastSlot=null}
else{g=lastG;var pf=g.querySelector(".row.f");if(pf)pf.classList.remove("f");if(lastSlot)lastSlot.innerHTML="";var ot=g.querySelector(".tm2");if(ot)ot.remove()}
var row=document.createElement("div");row.className="row f"+((!me&&meRe.test(m.body))?" ment":"");
var slot=null;
if(!me){slot=document.createElement("span");slot.className="slot";slot.innerHTML='<span class="av2'+rg(pr)+'" style="--c:'+col+'">'+avh(pr)+'</span>';slot.onclick=prof;row.appendChild(slot)}
var c=document.createElement("div");c.className="col";c.innerHTML='<div class="bb">'+fmt(m.body)+'</div>';row.appendChild(c);
if(!me){var fb=document.createElement("button");fb.className="fl";fb.textContent="⋯";fb.setAttribute("aria-label","Melden of blokkeren");fb.onclick=function(){menu(m,pr)};row.appendChild(fb)}
g.appendChild(row);
var tm=document.createElement("div");tm.className="tm2";tm.textContent=TF.format(new Date(t));g.appendChild(tm);
lastSlot=slot;lastU=m.user_id;lastT=t;
if(was||me){box.scrollTop=box.scrollHeight}else{nb.hidden=false}}
function menu(m,pr){
var o=document.createElement("div");o.className="ov";
function close(){o.remove()}
function main(){o.innerHTML='<div class="sheet"><b>@'+esc(pr.username||"?")+'</b><button class="btn ghost" id="a1">Bericht melden</button><button class="btn ghost" id="a2">Blokkeren</button><button class="back" id="a3" style="width:100%;margin-top:6px">Annuleren</button></div>';
o.querySelector("#a1").onclick=reasons;o.querySelector("#a2").onclick=blk;o.querySelector("#a3").onclick=close}
function reasons(){var R=[["spam","Spam of reclame"],["intimidatie","Intimidatie of pesten"],["seksueel","Seksuele of ongewenste inhoud"],["minderjarig","Lijkt minderjarig"],["anders","Anders"]];
o.innerHTML='<div class="sheet"><b>Waarom meld je dit?</b>'+R.map(function(r){return '<button class="btn ghost" data-r="'+r[0]+'">'+r[1]+'</button>'}).join("")+'<button class="back" id="a3" style="width:100%;margin-top:6px">Terug</button></div>';
o.querySelector("#a3").onclick=main;
o.querySelectorAll("[data-r]").forEach(function(b){b.onclick=async function(){
var i=await sb.from("reports").insert({reported:m.user_id,message_id:m.id,message_text:String(m.body).slice(0,500),room:r.slug,reason:b.dataset.r});
o.innerHTML='<div class="sheet c"><b>'+(i.error?"Melden lukt niet. Probeer het later opnieuw.":"Bedankt, we kijken ernaar.")+'</b></div>';setTimeout(close,1600)}})}
async function blk(){
var i=await sb.from("blocks").insert({blocked:m.user_id});
if(i.error&&i.error.code!=="23505"){o.innerHTML='<div class="sheet c"><b>Blokkeren lukt niet.</b></div>';setTimeout(close,1600);return}
box.querySelectorAll('[data-uid="'+m.user_id+'"]').forEach(function(e){e.remove()});
o.innerHTML='<div class="sheet c"><b>@'+esc(pr.username||"?")+' is geblokkeerd.</b><p class="small">Je ziet geen berichten meer van dit lid. Je kunt dit terugdraaien via Instellingen.</p></div>';setTimeout(close,1900)}
main();document.body.appendChild(o)}
var g=await sb.from("messages").select(SEL).eq("room",r.slug).order("created_at",{ascending:false}).limit(50);
if(g.data){g.data.reverse().forEach(add)}
if(!box.children.length)box.innerHTML='<div class="small c" style="margin:auto">Nog geen berichten. Zeg als eerste hallo!</div>';
chan=sb.channel("room-"+r.slug).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room=eq."+r.slug},async function(e){
var q=await sb.from("messages").select(SEL).eq("id",e.new.id).single();if(q.data){var f=box.querySelector(".small.c");if(f)box.innerHTML="";add(q.data)}}).subscribe();
setRoom(r.slug);paint();
if(unread[r.slug]){unread[r.slug]=0;sb.from("notifications").update({read:true}).eq("room",r.slug).eq("read",false).then(function(){})}
async function send(){var t=$("#tx").value.trim();if(!t)return;$("#sd").disabled=true;
var i=await sb.from("messages").insert({room:r.slug,body:t}).select(SEL).single();
$("#sd").disabled=false;
if(i.error){say("Versturen lukt niet.");return}
$("#tx").value="";if(typeof hideSug==="function")hideSug();var f=box.querySelector(".small.c");if(f)box.innerHTML="";add(i.data);$("#tx").focus()}
$("#sd").onclick=send;
sb.from("follows").select("followed,profiles!followed(username,verification,avatar_url,plan)").then(function(x){fol=(x.data||[]).map(function(y){return y.profiles}).filter(Boolean)});
var sug=$("#sug"),tx=$("#tx"),cur=[],sq=0;
function hideSug(){sug.hidden=true;sug.innerHTML="";cur=[]}
function tok(){var v=tx.value,c=tx.selectionStart==null?v.length:tx.selectionStart,m=/(^|\s)@([A-Za-z0-9._]{0,20})$/.exec(v.slice(0,c));return m?{q:m[2].toLowerCase(),start:c-m[2].length-1,end:c}:null}
function pick(u){var t=tok();if(!t)return;var v=tx.value;tx.value=v.slice(0,t.start)+"@"+u.username+" "+v.slice(t.end);var pos=t.start+u.username.length+2;try{tx.setSelectionRange(pos,pos)}catch(e){}hideSug();tx.focus()}
function showSug(list){cur=list;if(!list.length){hideSug();return}
sug.hidden=false;
sug.innerHTML=list.map(function(u,i){return '<button type="button" class="sg" data-i="'+i+'"><span class="mini'+rg(u)+'">'+avh(u)+'</span><b>@'+esc(u.username)+'</b>'+(u.verification==="verified"?'<span class="ck">✓</span>':'')+(u.tag?'<span class="small">'+esc(u.tag)+'</span>':'')+'</button>'}).join("");
sug.querySelectorAll(".sg").forEach(function(b){b.onpointerdown=function(e){e.preventDefault();pick(list[+b.dataset.i])}})}
function match(q,extra){var out=[],seenN={};seenN[p.username.toLowerCase()]=1;
function take(arr,tag){arr.forEach(function(u){var k=(u.username||"").toLowerCase();if(!k||seenN[k]||k.indexOf(q)<0)return;seenN[k]=1;out.push({username:u.username,verification:u.verification,avatar_url:u.avatar_url,plan:u.plan,tag:tag,pre:k.indexOf(q)===0?0:1})})}
take(fol,"volg je");take(Object.keys(known).map(function(k){return known[k]}),"in deze kamer");if(extra)take(extra,"");
out.sort(function(a,b){return a.pre-b.pre});return out.slice(0,6)}
tx.oninput=async function(){var t=tok();if(!t){hideSug();return}
var l=match(t.q);showSug(l);
if(t.q.length>=2&&l.length<6){var n=++sq;
var g=await sb.from("profiles").select("username,verification,avatar_url,plan").ilike("username",t.q.replace(/_/g,"\\_")+"%").neq("id",p.id).limit(6);
if(n!==sq||!tok())return;showSug(match(t.q,g.data||[]))}};
tx.onblur=function(){setTimeout(hideSug,200)};
tx.onkeydown=function(e){
if(e.key==="Escape"){hideSug();return}
if(e.key==="Enter"){if(!sug.hidden&&cur.length){e.preventDefault();pick(cur[0]);return}send()}}}

async function gate(p,user){
myYear=null;
var q=await sb.from("private_profiles").select("birth_year").eq("id",user.id).maybeSingle();
if(q.data){myYear=q.data.birth_year;home(p);return}
var by=(user.user_metadata||{}).birth_year;
if(by){var i=await sb.from("private_profiles").insert({id:user.id,birth_year:by});if(!i.error){myYear=by;home(p);return}}
askYear(p,user)}
function askYear(p,user){
app.innerHTML=head()+'<div class="card"><b>Nog één ding</b><p class="small">Vul je geboortejaar in. Het wordt nergens getoond en bepaalt welke kamers voor jou open zijn. Je kunt het later niet meer wijzigen.</p><label>Geboortejaar</label><input type="text" id="by" inputmode="numeric" maxlength="4" placeholder="bijv. 1995"><button class="btn" id="go">Opslaan</button><div id="msg"></div></div>';
$("#go").onclick=async function(){var by=$("#by").value.trim();
if(!/^(19|20)\d\d$/.test(by)||+by>new Date().getFullYear()-18){say("Alleen voor 18+. Vul een geldig geboortejaar in.");return}
var i=await sb.from("private_profiles").insert({id:user.id,birth_year:+by});
if(i.error){say("Opslaan lukt niet.");return}
myYear=+by;home(p)}}

async function start(){
var c=cfg();
if(!c||!window.supabase){setup();return}
if(!sb)sb=window.supabase.createClient(c.url,c.key);
var s=await sb.auth.getSession();
if(s.data&&s.data.session){afterLogin(s.data.session.user)}else auth()}
start();
</script>
